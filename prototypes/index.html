<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qnt. | The 50 Liquid Glass Master Prototype Observatory</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Syne:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #FAF8F5; color: #000; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border-color: #06B6D4;
    }
  </style>
</head>
<body class="p-6 md:p-12 min-h-screen">
  <div class="max-w-7xl mx-auto">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between border-b-4 border-black pb-8 mb-12">
      <div>
        <div class="text-4xl sm:text-6xl font-black font-brand tracking-tighter">qnt<span class="text-cyan-500">.</span> 50-Prototype Observatory</div>
        <p class="text-slate-700 font-mono text-sm sm:text-base mt-2 font-bold">50 Standalone Liquid Glass 3D WebGL Architectures, Non-Repeating Pastel Palettes &amp; 21st.dev Component Registries</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-2 flex-wrap">
        <span class="bg-black text-white text-xs font-mono font-black px-4 py-2.5 rounded-xl">50 MASTER STANDALONE BUILDS</span>
        <span class="bg-cyan-300 text-black text-xs font-mono font-black px-4 py-2.5 rounded-xl border-2 border-black">PHYSICAL TRANSMISSION GLASS</span>
      </div>
    </div>

    <!-- 50 PROTOTYPES GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="grid-container">
      <!-- Injected by simple loop below -->
    </div>

  </div>

  <script>
    const geometries = [
      "Torus Knot Vortex", "Icosahedron Crystal", "Sovereign Glass Coin", "Tetrahedron Pyramid",
      "Dodecahedron Core", "Liquid Glass Torus", "Octahedron Diamond", "Harmonic Ripple Sphere",
      "Prismatic Capsule", "Curved Mobius Arc"
    ];
    const styles = [
      "Frosted Cream & Cyan", "Pastel Lavender & Indigo", "Pastel Mint & Emerald", "Pastel Peach & Amber",
      "Pastel Coral & Crimson", "Pastel Sky & Azure", "Pastel Butter Gold", "Pastel Lilac & Violet",
      "Pastel Sage & Platinum", "Pastel Opal & Slate"
    ];

    const container = document.getElementById('grid-container');
    for (let i = 1; i <= 50; i++) {
      const geo = geometries[(i - 1) % geometries.length];
      const style = styles[(i - 1) % styles.length];
      const card = document.createElement('a');
      card.href = `proto${i}.html`;
      card.className = "glass-card p-6 flex flex-col justify-between group";
      card.innerHTML = `
        <div>
          <div class="flex justify-between items-center mb-3">
            <span class="bg-black text-white font-mono font-black text-[10px] px-2 py-0.5 rounded-md">SUITE #${i.toString().padStart(2, '0')}</span>
            <span class="font-mono text-[10px] font-bold text-slate-500">${style}</span>
          </div>
          <h3 class="text-xl font-black mb-1 group-hover:text-cyan-600 transition">Liquid Glass Suite #${i.toString().padStart(2, '0')}</h3>
          <div class="text-xs text-cyan-700 font-bold mb-3 font-mono">3D: ${geo}</div>
          <p class="text-[11px] text-slate-600 leading-relaxed font-medium mb-4">
            Physical optical glass (IOR: 1.52) with tactile drag inertia and bespoke analytical telemetry.
          </p>
        </div>
        <div class="bg-black text-white text-center font-mono font-black text-xs py-2.5 rounded-xl group-hover:bg-cyan-500 group-hover:text-black transition">
          Launch Suite #${i.toString().padStart(2, '0')} &rarr;
        </div>
      `;
      container.appendChild(card);
    }
  </script>
</body>
</html>
